name: Build Binaries
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag/version to build. Defaults to package.json version.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Pack npm Candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Store npm Candidate
        uses: node-3d/addon-tools/actions/npm-candidate-upload@1073c0a6403f6c20df2135f03950a568e865aa16

  build:
    name: Build (${{ matrix.target }})
    needs: package
    strategy:
      fail-fast: false
      matrix: &native-matrix
        include:
          - target: windows-x64
            os: windows-2022
            node_arch: x64
            msbuild_arch: x64
            vcpkg_triplet: x64-windows
          - target: windows-arm64
            os: windows-11-vs2026-arm
            node_arch: arm64
            msbuild_arch: arm64
            vs_prerelease: true
            vcpkg_triplet: arm64-windows
            windows_arm64: '1'
          - target: linux-x64
            os: ubuntu-22.04
            node_arch: x64
            vcpkg_triplet: x64-linux
          - target: linux-arm64
            os: ubuntu-22.04-arm
            node_arch: arm64
            vcpkg_triplet: arm64-linux
          - target: darwin-x64
            os: macos-26-intel
            node_arch: x64
            cmake_osx_architectures: x86_64
            vcpkg_triplet: x64-osx
          - target: darwin-arm64
            os: macos-26
            node_arch: arm64
            vcpkg_triplet: arm64-osx

    runs-on: ${{ matrix.os }}

    env:
      GNS_CMAKE_OSX_ARCHITECTURES: ${{ matrix.cmake_osx_architectures }}
      GNS_WINDOWS_ARM64: ${{ matrix.windows_arm64 }}
      MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.target, 'darwin-') && '13.5' || '' }}
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg_triplet }}
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_triplet }}

    steps:

      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
          cache: 'npm'

      - name: Print Native Target
        run: |
          echo "runner=$(uname -s)-$(uname -m)"
          node -p "'node=' + process.version + ' platform=' + process.platform + ' arch=' + process.arch"
          npm config get arch

      - name: Install Modules
        run: npm ci --ignore-scripts

      - name: Install CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.x'

      - name: Add msbuild to PATH
        if: startsWith(matrix.target, 'windows-')
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: ${{ matrix.msbuild_arch }}
          vs-prerelease: ${{ matrix.vs_prerelease || false }}

      - name: Install vcpkg Dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Build Source
        run: npm run build:source

      - name: Verify macOS deployment target
        if: startsWith(matrix.target, 'darwin-')
        run: |
          set -euo pipefail
          checked=0
          while IFS= read -r -d '' file; do
            versions="$(otool -l "$file" | awk '
              $1 == "cmd" {
                wanted = $2 == "LC_BUILD_VERSION" ? "minos" : ($2 == "LC_VERSION_MIN_MACOSX" ? "version" : "")
              }
              wanted != "" && $1 == wanted { print $2; wanted = "" }
            ')"
            if [ -z "$versions" ] || printf '%s\n' "$versions" | grep -Evxq '13\.5(\.0)?'; then
              echo "Unexpected or missing macOS deployment target: $file" >&2
              printf '%s\n' "$versions" >&2
              exit 1
            fi
            checked=$((checked + 1))
          done < <(find bin-* -type f \( -name '*.a' -o -name '*.dylib' -o -name '*.node' \) -print0)
          test "$checked" -gt 0
          echo "Verified $checked Mach-O files target macOS 13.5"
      - name: Store Native Candidate
        uses: node-3d/addon-tools/actions/native-candidate-upload@1073c0a6403f6c20df2135f03950a568e865aa16
        with:
          artifact-name: native-${{ matrix.target }}

  consumer-tests:
    name: Packed Consumer (${{ matrix.target }})
    needs: [package, build]
    strategy:
      fail-fast: false
      matrix: *native-matrix
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
      - name: Install Packed Consumer Candidate
        id: consumer
        uses: node-3d/addon-tools/actions/consumer-install@1073c0a6403f6c20df2135f03950a568e865aa16
        with:
          package-name: '@node-3d/deps-gns'
          binary-artifact: native-${{ matrix.target }}
          fixture: test-consumer
      - name: Build Packed Consumer Addon
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: npm run build
      - name: Run Packed Consumer Tests
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: npm test

  release:
    name: Create Release
    needs: consumer-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Get Package Version
        id: package-version
        run: |
          release_tag="${{ inputs.release_tag }}"
          if [ -z "$release_tag" ]; then
            release_tag="$(node -p "require('./package').version")"
          fi
          echo "version=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Download Native Candidates
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-candidates
          merge-multiple: true
      - name: Attest Binaries
        uses: actions/attest@v4
        with:
          subject-path: release-candidates/*.gz
      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.package-version.outputs.version }}
          name: Release ${{ steps.package-version.outputs.version }}
          files: release-candidates/*.gz
